<mat-toolbar class="mat-toolbar">
    <div class="flex-container" color="primary">
        <span class="toolbar-title">Controle de Fornecedores</span>
        <button mat-fab class="accent" routerLink="/fornecedores/new">
            <mat-icon>add</mat-icon>
        </button>
    </div>
</mat-toolbar>

<mat-form-field appearance="outline" class="flex-container">
    <mat-label>Filtro</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ex: Fly Tech" #input>
</mat-form-field>

<table mat-table [dataSource]="dataSource" class="fornecedor-table mat-elevation-z8">

    <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let fornecedor"> {{fornecedor.id}} </td>
    </ng-container>

    <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef> Nome </th>
        <td mat-cell *matCellDef="let fornecedor"> {{fornecedor.nome}} </td>
    </ng-container>


    <ng-container matColumnDef="cnpj">
        <th mat-header-cell *matHeaderCellDef> CNPJ </th>
        <td mat-cell *matCellDef="let fornecedor"> {{fornecedor.cnpj}} </td>
    </ng-container>

  
    <ng-container matColumnDef="telefone">
        <th mat-header-cell *matHeaderCellDef> Telefone </th>
        <td mat-cell *matCellDef="let fornecedor"> {{fornecedor.telefone}} </td>
    </ng-container>

   
    <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> Email </th>
        <td mat-cell *matCellDef="let fornecedor"> {{fornecedor.email}} </td>
    </ng-container>

    <ng-container matColumnDef="ativo">
        <th mat-header-cell *matHeaderCellDef> Ativo </th>
        <td mat-cell *matCellDef="let fornecedor"> {{fornecedor.ativo ? 'Sim' : 'Não'}} </td>
    </ng-container>


    <ng-container matColumnDef="acao">
        <th mat-header-cell *matHeaderCellDef> Ação </th>
        <td mat-cell *matCellDef="let obj">
            <button mat-icon-button color="primary" routerLink="/fornecedores/{{obj.id}}/edit">
                <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="excluirFornecedor(obj)">
                <mat-icon>delete</mat-icon>
            </button>
        </td>
    </ng-container>

    
    
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
