<mat-toolbar class="mat-toolbar">
  <div class="flex-container" color="primary">
    <span class="toolbar-title">Controle de Modelos</span>
    <button mat-fab class="accent" (click)="novoModelo()" aria-label="Novo modelo">
      <mat-icon>add</mat-icon>
    </button>
  </div>
</mat-toolbar>

<div class="filter-container">
  <mat-form-field appearance="outline">
    <mat-label>Filtro por Nome</mat-label>
    <input
      matInput
      [value]="filtroNome"
      (keyup.enter)="filtrarPorNome(input.value)"
      placeholder="Ex: Mini 4 Pro"
      #input
    />
  </mat-form-field>

  <button mat-raised-button color="primary" (click)="filtrarPorNome(input.value)">
    Buscar
  </button>

  <button mat-button color="warn" (click)="limparFiltro(input)">
    Limpar Filtro
  </button>
</div>

<table mat-table [dataSource]="dataSource" class="modelo-table mat-elevation-z8">
  <!-- ID Column -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let modelo">{{ modelo.id }}</td>
  </ng-container>

  <!-- Nome Column -->
  <ng-container matColumnDef="nome">
    <th mat-header-cell *matHeaderCellDef>Nome</th>
    <td mat-cell *matCellDef="let modelo">{{ modelo.nome }}</td>
  </ng-container>

  <!-- Marca Column -->
  <ng-container matColumnDef="marca">
    <th mat-header-cell *matHeaderCellDef>Marca</th>
    <td mat-cell *matCellDef="let modelo">{{ modelo.marca?.nome }}</td>
  </ng-container>

  <!-- Acao Column -->
  <ng-container matColumnDef="acao">
    <th mat-header-cell *matHeaderCellDef>Ação</th>
    <td mat-cell *matCellDef="let obj">
      <button
        mat-icon-button
        color="primary"
        aria-label="Editar modelo"
        (click)="$event.stopPropagation(); editarModelo(obj)"
        (keydown)="$event.stopPropagation()"
      >
        <mat-icon>edit</mat-icon>
      </button>
      <button
        mat-icon-button
        color="warn"
        aria-label="Excluir modelo"
        (click)="$event.stopPropagation(); excluirModelo(obj)"
        (keydown)="$event.stopPropagation()"
      >
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr
    mat-row
    *matRowDef="let row; columns: displayedColumns"
    tabindex="0"
    [attr.aria-label]="'Ver detalhes de ' + row.nome"
    (click)="abrirDetalhes(row)"
    (keydown.enter)="abrirDetalhes(row)"
    (keydown.space)="$event.preventDefault(); abrirDetalhes(row)"
  ></tr>
</table>

<mat-paginator
  [length]="totalItems"
  [pageIndex]="pageIndex"
  [pageSize]="pageSize"
  [pageSizeOptions]="[5, 10, 20]"
  (page)="onPageChange($event)"
>
</mat-paginator>
