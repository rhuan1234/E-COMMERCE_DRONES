<h2 mat-dialog-title>{{ form.value.id ? 'Editar Câmera' : 'Nova Câmera' }}</h2>

<mat-dialog-content>
    <form [formGroup]="form" class="form">
        <!-- Modelo -->
        <mat-form-field appearance="outline" class="full-width-input">
            <mat-label>Modelo</mat-label>
            <input matInput formControlName="modelo" placeholder="Modelo da câmera">
        </mat-form-field>
    
        <!-- Marca -->
        <mat-form-field appearance="outline" class="full-width-input">
            <mat-label>Marca</mat-label>
            <input matInput formControlName="marca" placeholder="Marca da câmera">
        </mat-form-field>
    
        <!-- Resolução -->
        <mat-form-field appearance="outline" class="full-width-input">
            <mat-label>Resolução</mat-label>
            <input matInput formControlName="resolucao" placeholder="Resolução da câmera">
        </mat-form-field>
    
        <!-- Zoom -->
        <mat-form-field appearance="outline" class="full-width-input">
            <mat-label>Zoom</mat-label>
            <input matInput type="number" formControlName="zoom" placeholder="Zoom da câmera">
        </mat-form-field>
    
        <!-- Estabilização -->
        <mat-form-field appearance="outline" class="full-width-input">
            <mat-label>Estabilização</mat-label>
            <mat-select formControlName="estabilizacao">
                <mat-option [value]="true">Contém</mat-option>
                <mat-option [value]="false">Não contém</mat-option>
            </mat-select>
        </mat-form-field>
    
        <!-- FPS -->
        <mat-form-field appearance="outline" class="full-width-input">
            <mat-label>FPS</mat-label>
            <input matInput formControlName="fps" placeholder="FPS da câmera">
        </mat-form-field>
    </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-raised-button 
        color="warn" 
        (click)="excluir()" 
        [disabled]="!form.value.id">
        <mat-icon>delete</mat-icon>
        Excluir
    </button>

    <button mat-raised-button 
        color="primary" 
        (click)="salvar()" 
        [disabled]="form.invalid">
        <mat-icon>save</mat-icon>
        Salvar
    </button>
</mat-dialog-actions>
