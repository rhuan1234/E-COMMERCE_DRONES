services:
  aws-emulator:
    build:
      context: ./docker/aws-emulator
    container_name: drones-aws-emulator
    ports:
      - "127.0.0.1:9297:9297"
    volumes:
      - ./.aws-emulator:/root/.aws/emulator
    mem_limit: 1g
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: drones-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    ports:
      - "127.0.0.1:8180:8180"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    restart: unless-stopped
