<mat-toolbar class="mat-toolbar">
    <div class="flex-container" color="primary">
        <span class="toolbar-title">Controle de Administradores</span>
        <button mat-fab class="accent" routerLink="/admin/administradores/new">
            <mat-icon>add</mat-icon>
        </button>
    </div>
</mat-toolbar>

<div class="filter-container">
    <mat-form-field appearance="outline">
        <mat-label>Filtro por Login</mat-label>
        <input
            matInput
            [value]="filtroLogin"
            (keyup.enter)="filtrarPorLogin(input.value)"
            placeholder="Ex: rhuan"
            #input
        >
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="filtrarPorLogin(input.value)">
        Buscar
    </button>

    <button mat-button color="warn" (click)="limparFiltro(input)">
        Limpar Filtro
    </button>
</div>

<table mat-table [dataSource]="dataSource" class="administrador-table mat-elevation-z8">

    <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let administrador"> {{administrador.id}} </td>
    </ng-container>

    <ng-container matColumnDef="login">
        <th mat-header-cell *matHeaderCellDef> Login </th>
        <td mat-cell *matCellDef="let administrador"> {{administrador.login}} </td>
    </ng-container>

    <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> Email </th>
        <td mat-cell *matCellDef="let administrador"> {{administrador.email}} </td>
    </ng-container>

    <ng-container matColumnDef="acao">
        <th mat-header-cell *matHeaderCellDef> Ação </th>
        <td mat-cell *matCellDef="let obj">
            <button mat-icon-button color="warn" (click)="excluirAdministrador(obj)">
                <mat-icon>delete</mat-icon>
            </button>
        </td>
    </ng-container>

    
    
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<mat-paginator
    [length]="totalItems"
    [pageIndex]="pageIndex"
    [pageSize]="pageSize"
    [pageSizeOptions]="[5, 10, 20]"
    (page)="onPageChange($event)">
</mat-paginator>
