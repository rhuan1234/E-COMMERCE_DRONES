<mat-toolbar class="mat-toolbar">
    <div class="flex-container" color="primary">
        <span class="toolbar-title">Controle de Fornecedores</span>
        <button mat-fab class="accent" routerLink="/admin/fornecedores/new">
            <mat-icon>add</mat-icon>
        </button>
    </div>
</mat-toolbar>

<div class="filter-container">
    <mat-form-field appearance="outline">
        <mat-label>Filtro por Nome</mat-label>
        <input
            matInput
            [value]="filtroNome"
            (keyup.enter)="filtrarPorNome(input.value)"
            placeholder="Ex: Fly Tech"
            #input
        >
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="filtrarPorNome(input.value)">
        Buscar
    </button>

    <button mat-button color="warn" (click)="limparFiltro(input)">
        Limpar Filtro
    </button>
</div>

<table mat-table [dataSource]="dataSource" class="fornecedor-table mat-elevation-z8">

    <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let fornecedor"> {{fornecedor.id}} </td>
    </ng-container>

    <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef> Nome </th>
        <td mat-cell *matCellDef="let fornecedor"> {{fornecedor.nome}} </td>
    </ng-container>


    <ng-container matColumnDef="cnpj">
        <th mat-header-cell *matHeaderCellDef> CNPJ </th>
        <td mat-cell *matCellDef="let fornecedor"> {{fornecedor.cnpj}} </td>
    </ng-container>

  
    <ng-container matColumnDef="telefone">
        <th mat-header-cell *matHeaderCellDef> Telefone </th>
        <td mat-cell *matCellDef="let fornecedor"> {{fornecedor.telefone}} </td>
    </ng-container>

   
    <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> Email </th>
        <td mat-cell *matCellDef="let fornecedor"> {{fornecedor.email}} </td>
    </ng-container>



    <ng-container matColumnDef="acao">
        <th mat-header-cell *matHeaderCellDef> Ação </th>
        <td mat-cell *matCellDef="let obj">
            <button
                mat-icon-button
                color="primary"
                routerLink="/admin/fornecedores/{{obj.id}}/edit"
                (click)="$event.stopPropagation()"
                (keydown)="$event.stopPropagation()">
                <mat-icon>edit</mat-icon>
            </button>
            <button
                mat-icon-button
                color="warn"
                (click)="$event.stopPropagation(); excluirFornecedor(obj)"
                (keydown)="$event.stopPropagation()">
                <mat-icon>delete</mat-icon>
            </button>
        </td>
    </ng-container>

    
    
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns;"
        tabindex="0"
        [attr.aria-label]="'Ver detalhes de ' + row.nome"
        (click)="abrirDetalhes(row)"
        (keydown.enter)="abrirDetalhes(row)"
        (keydown.space)="$event.preventDefault(); abrirDetalhes(row)">
    </tr>
</table>

<mat-paginator
    [length]="totalItems"
    [pageIndex]="pageIndex"
    [pageSize]="pageSize"
    [pageSizeOptions]="[5, 10, 20]"
    (page)="onPageChange($event)">
</mat-paginator>
