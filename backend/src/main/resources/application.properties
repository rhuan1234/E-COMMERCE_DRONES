quarkus.datasource.db-kind = postgresql
quarkus.datasource.username = postgres
quarkus.datasource.password = 123456
quarkus.datasource.jdbc.url = jdbc:postgresql://localhost:5432/dronesDb

#Desabilitar o docker
quarkus.devservices.enabled = false

quarkus.hibernate-orm.database.generation=drop-and-create
#quarkus.hibernate-orm.database.generation=update

quarkus.hibernate-orm.log.sql = true 
quarkus.hibernate-orm.log.bind-parameters=true

# Keycloak / OIDC (OAuth 2.0 + OpenID Connect)
app.keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8180}
app.keycloak.realm=${KEYCLOAK_REALM:drones}
app.keycloak.client-id=${KEYCLOAK_CLIENT_ID:drones-backend}
app.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:drones-backend-dev-secret}

quarkus.oidc.auth-server-url=${app.keycloak.server-url}/realms/${app.keycloak.realm}
quarkus.oidc.client-id=${app.keycloak.client-id}
quarkus.oidc.credentials.secret=${app.keycloak.client-secret}
quarkus.oidc.application-type=service
quarkus.oidc.token.principal-claim=preferred_username
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.http.auth.proactive=false

# Em %test, desabilita discovery externo para manter ./mvnw test independente de containers
%test.quarkus.oidc.tenant-enabled=false

quarkus.mailer.host=sandbox.smtp.mailtrap.io
quarkus.mailer.port=2525
quarkus.mailer.start-tls=OPTIONAL

quarkus.mailer.username=679f255ea19806
quarkus.mailer.password=5790980acf9a3b

quarkus.mailer.from=no-reply@armas.com
quarkus.mailer.mock=false

#cors policy
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200

# Armazenamento de imagens no S3 (AWS Emulator em %dev)
app.s3.bucket=${APP_S3_BUCKET:drones-imagens}

quarkus.s3.aws.region=${AWS_REGION:us-east-1}
quarkus.s3.sync-client.type=url
quarkus.s3.path-style-access=${S3_PATH_STYLE_ACCESS:true}
quarkus.s3.devservices.enabled=false

%dev.quarkus.s3.endpoint-override=${S3_ENDPOINT_URL:https://127.0.0.1:9297}
%dev.quarkus.s3.aws.credentials.type=static
%dev.quarkus.s3.aws.credentials.static-provider.access-key-id=${AWS_ACCESS_KEY_ID:emulator}
%dev.quarkus.s3.aws.credentials.static-provider.secret-access-key=${AWS_SECRET_ACCESS_KEY:emulator}
%dev.quarkus.s3.sync-client.tls-trust-managers-provider.type=file-store
%dev.quarkus.s3.sync-client.tls-trust-managers-provider.file-store.path=${AWS_EMULATOR_TRUSTSTORE:../.aws-emulator/9297/truststore.p12}
%dev.quarkus.s3.sync-client.tls-trust-managers-provider.file-store.type=PKCS12
%dev.quarkus.s3.sync-client.tls-trust-managers-provider.file-store.password=${AWS_EMULATOR_TRUSTSTORE_PASSWORD:changeit}

%test.quarkus.s3.endpoint-override=https://127.0.0.1:9297
%test.quarkus.s3.aws.credentials.type=static
%test.quarkus.s3.aws.credentials.static-provider.access-key-id=test
%test.quarkus.s3.aws.credentials.static-provider.secret-access-key=test
